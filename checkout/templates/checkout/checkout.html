{% extends "base.html" %}
{% load static %}
{% load crispy_forms_tags %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'checkout/css/checkout.css' %}">
{% endblock %}

{% block content %}

<div class="site-main">
    <div class="main-box container-fluid">
        <div class="row">
            <div class="col">
                <h1 class="plant-detail-header">Checkout</h1>
            </div>
        </div>
        <div class="row">
            <div class="col-12 col-lg 6">
                <p>Please add your details to the form below to complete your purchase:</p>
                <form action="{% url 'checkout' %}" method="POST" id="payment-form">
                    {% csrf_token %}
                    {{ form|crispy }}
                    <button type="submit" class="detail-btn">Place order</button>
                </form>
            </div>
        </div>
    </div>
</div>



{% endblock %}
