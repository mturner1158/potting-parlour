{% extends "base.html" %}
{% load static %}
{% load crispy_forms_tags %}

{% block content %}
<div class="site-main">
    <div class="container main-box">
    <h1 class="my-4">Add or Edit a Plant</h1>

    <form method="POST" enctype="multipart/form-data" class="col-12 col-lg-8">
        {% csrf_token %}
        {{ form|crispy }}
        <div class="d-flex gap-2 mt-3">
        <a href="{% url 'all_plants' %}" class="detail-btn">Cancel</a>
        <button type="submit" class="checkout-btn">Save plant</button>
        </div>
    </form>

    {% if plant %}
    <form method="POST" action="{% url 'delete_plant' plant.id %}" class="mt-5"
            onsubmit="return confirm('Delete this plant? This cannot be undone.');">
        {% csrf_token %}
        <button type="submit" class="detail-btn">Delete this plant</button>
    </form>
    {% endif %}
    </div>
</div>
{% endblock %}
