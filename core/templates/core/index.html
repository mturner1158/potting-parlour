{% extends "base.html" %}

{% load static %}

{% block content %}

<section class="flex-grow-1 container-fluid px-3 px-md-5 pt-4">
    <h1 class="visually-hidden">Welcome</h1>
    <!-- hero content here -->
</section>

<!-- Content box (bottom, centred) -->
<section class="container-fluid px-3 pb-3">
    <div class="row justify-content-center">
        <div class="col-11 col-md-6 col-lg-5 col-xl-4">
            <div class="content-box p-3">
                <div class="row text-center">
                    <h1 class="logo-text">Potting Parlour</h1>
                </div>
                <div class="row text-center">
                    <h2 class="sub-header h4">Find your next plant friend<h2>
                </div>
                <div class="row">
                    <div class="col-3 home-btn">
                        <a href="{% url 'all_plants' %}">All Products</a>
                    </div>
                    <div class="col-3 home-btn">
                        <a href="">Shady</a>
                    </div>
                    <div class="col-3 home-btn">
                        <a href="">Pet Friendly</a>
                    </div>
                    <div class="col-3 home-btn">
                        <a href="">Low Effort</a>
                    </div>
                </div>
                <div class="row text-center login-btn">
                    {% if request.user.is_authenticated %}
                    <a href="{% url 'account_logout' %}" class="login-btn"><i class="fa-solid fa-person-circle-xmark"></i> Logout</a>
                    {% else %}
                    <a href="{% url 'account_login' %}" class="login-btn"> <i class="fa-regular fa-circle-user"></i>
                        Login / Register</a>
                    {% endif %}
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
